apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  labels:
    app: inventory
spec:
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      containers:
      - name: inventory
        image: dev/inventory:dev
        resources:
          requests:
            cpu: 100m
            memory: 384Mi
          limits:
            cpu: 1
            memory: 1Gi
        ports:
        - containerPort: 8080
        env:  
          - name: ADS_SERVICE_HOST
            value: ads:8080

  