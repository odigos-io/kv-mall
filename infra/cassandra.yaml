apiVersion: apps/v1
kind: Deployment
metadata:
  name: cassandra
  namespace: kv-mall-infra
spec:
  selector:
    matchLabels:
      app: cassandra
  replicas: 1
  template:
    metadata:
      labels:
        app: cassandra
    spec:
      containers:
      - name: cassandra
        image: cassandra:4.0
        resources:
          requests:
            cpu: 250m
            memory: 2Gi
          limits:
            cpu: 2
            memory: 2Gi
        readinessProbe:
          tcpSocket:
            port: 9042
          initialDelaySeconds: 5
          periodSeconds: 5
        ports:
        - containerPort: 9042
        env:
        - name: CASSANDRA_CLUSTER_NAME
          value: "kvmall"
        - name: MAX_HEAP_SIZE
          value: "1G"
        - name: HEAP_NEWSIZE
          value: "256M"
---
apiVersion: v1
kind: Service
metadata:
  name: cassandra
  namespace: kv-mall-infra
spec:
    selector:
        app: cassandra
    ports:
    - protocol: TCP
      port: 9042
      targetPort: 9042
